<!doctype html>
<!-- The Logistics Catalog's own page, served at /staff/catalogue: its manifest and icon are here from the first byte, so installing it gives the Catalog (iOS reads them as the page loads). -->
<html lang="en" data-app="catalog">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catalog · HAU USC Logistics</title>
    <meta name="description" content="Catalogue HAU USC Department of Logistics items shelf by shelf, with or without a connection. For Logistics staff." />
    <meta name="theme-color" content="#2b0a0c" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-title" content="Catalog" />
    <link rel="icon" type="image/png" href="/brand/dol-mark.png" />
    <link rel="apple-touch-icon" href="/icons/catalog-touch-icon.png" />
    <link rel="manifest" href="/catalogue.webmanifest" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app"></div>
    <noscript>The Catalog needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
