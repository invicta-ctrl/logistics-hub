# The local gates every slice already runs, repeated on GitHub so a red change is visible before it
# reaches main (Workers Builds deploys every push to main; this check does not block it by itself).
name: CI

on:
  push:
    branches: [main, "road-to-v2/**", "slice/**", "ops/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The Activity performance harness is skipped in ordinary runs; this smoke run keeps it working on the current schema.
      - run: ACTIVITY_PERF=1 ACTIVITY_PERF_TIERS=1000 npx vitest run tests/activity-perf.test.ts
      - run: npm run verify:privacy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  worker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: worker-e2e-traces
          path: test-results/
          retention-days: 7
