# The local gates every slice already runs, repeated on GitHub so a red change is visible before it
# reaches main. While Workers Builds deploys every push to main, this check does not block a deploy by itself;
# deploy.yml, once Earl switches it on, deploys only a commit whose run of this workflow passed.
name: CI

on:
  push:
    branches: [main, "road-to-v2/**", "slice/**", "ops/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen main SHA for bounded V1.16 model qualification (no deployment or data changes)
        required: true
        type: string
      receipt_run:
        description: Optional read-only recovery of a recorded V1.16 qualification receipt (no inference)
        required: false
        default: ""
        type: string
      qualification_task:
        description: Recover the spent text receipt, or measure fresh guarded roles and photos without promotion
        required: true
        default: receipt
        type: choice
        options:
          - receipt
          - fresh

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'role-qualification' || 'regression' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'qualification-no-checks' || 'checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The performance harnesses are skipped in ordinary runs; these smoke runs keep them working on the current schema
      # (the Stock one also fails unless its rows match the pre-R7 query).
      - run: ACTIVITY_PERF=1 ACTIVITY_PERF_TIERS=1000 npx vitest run tests/activity-perf.test.ts
      - run: STOCK_ACTIVITY_PERF=1 STOCK_ACTIVITY_PERF_TIERS=1000 npx vitest run tests/stock-activity-perf.test.ts
      - run: npm run verify:privacy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --reporter=line,github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/browser/
          retention-days: 7

  worker-e2e:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'qualification-no-worker-e2e' || 'worker-e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:worker -- --reporter=line,github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: worker-e2e-traces
          path: test-results/
          retention-days: 7

  role-qualification:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the frozen current main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const expected = process.env.EXPECTED_SHA;
            const checked = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            const current = execFileSync("git", ["ls-remote", "origin", "refs/heads/main"], { encoding: "utf8" }).split(/\s/)[0];
            if (!/^[a-f0-9]{40}$/.test(expected ?? "") || expected !== process.env.GITHUB_SHA || checked !== expected || current !== expected) {
              console.error("Frozen main source mismatch. No provider request was sent."); process.exit(1);
            }
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.receipt_run == '' && inputs.qualification_task == 'fresh'
      - run: npx playwright install --with-deps chromium
        if: inputs.receipt_run == '' && inputs.qualification_task == 'fresh'
      - name: Recover a recorded public qualification receipt without inference
        if: inputs.receipt_run != '' || inputs.qualification_task != 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_RUN: ${{ inputs.receipt_run || '38215952629' }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const run = process.env.RECEIPT_RUN;
            const receipts = {
              "38215952629": { sha: "3615f97eec335216b7ef5fb3d0ff198bdd44797c", result: "success", digests: ["72d23615672d32fddca71650bd02ea48952df1e8f88556cb4748de97ef404297"] },
              "38320413046": { sha: "eb512c9bcde7cbedbc8da844a27d99ffeab1e09e", result: "failure", digests: ["da86911b98bf97973e0b5c38b1706ff9c235146986307fef86696095f0f81467", "fc57239292b72193ef2059ef317fbfac0a3469b74d83e5d8ac56ba3ff587f5ee"] }
            };
            if (!Object.hasOwn(receipts, run)) throw new Error("Only recorded V1.16 receipts are authorized.");
            const expected = receipts[run];
            const source = JSON.parse(execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${run}`], { encoding: "utf8" }));
            if (source.head_sha !== expected.sha || source.head_branch !== "main" || source.event !== "workflow_dispatch" || source.path !== ".github/workflows/ci.yml" || source.status !== "completed" || source.conclusion !== expected.result) throw new Error("Qualification receipt source mismatch.");
            execFileSync("gh", ["run", "download", run, "--repo", process.env.GITHUB_REPOSITORY, "--name", "v116-role-qualification", "--dir", "qualification-receipt"], { stdio: "ignore" });
            const receipt = readFileSync("qualification-receipt/role-qualification.txt");
            if (receipt.byteLength > 128000 || expected.digests.some(digest => !receipt.toString("utf8").includes(digest))) throw new Error("Unrecognized qualification receipt.");
            const provenance = { run, source: source.head_sha, result: source.conclusion, bytes: receipt.byteLength, sha256: createHash("sha256").update(receipt).digest("hex"), additionalInferenceCalls: 0 };
            writeFileSync("role-qualification.txt", Buffer.concat([Buffer.from(`measurement receipt source ${JSON.stringify(provenance)}\n`), receipt]));
          '
      - name: Measure fresh guarded roles and licensed photos
        if: inputs.receipt_run == '' && inputs.qualification_task == 'fresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Validate every public source/preparer before any additional inference. The prior185-call receipt is spent.
          node scripts/evaluate-roles.mjs --photos tests/fixtures/v116-photo-heldout.json --dry --prior-neurons 128.288 --stop-neurons 240 > role-qualification.txt 2>&1
          node scripts/evaluate-roles.mjs --guarded tests/fixtures/v116-guarded-role-heldout.json --granite 40 --qwen 40 --glm 0 --prior-neurons 128.288 --stop-neurons 400 >> role-qualification.txt 2>&1
          photo_prior=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const line = readFileSync("role-qualification.txt", "utf8").split("\n").find(line => line.startsWith("guarded receipt "));
            const receipt = line ? JSON.parse(line.slice("guarded receipt ".length)) : null;
            const used = receipt?.combinedAccountedNeurons;
            if (!receipt?.complete || !receipt.coreUnchanged || !receipt.rolesRemainReviewOnly || !Number.isFinite(used) || used < 128.288 || used >= 400) throw new Error("No complete verified guard receipt; photo inference refused.");
            console.log(Math.ceil(used * 1000) / 1000);
          ')
          node scripts/evaluate-roles.mjs --photos tests/fixtures/v116-photo-heldout.json --prior-neurons "$photo_prior" --stop-neurons 240 >> role-qualification.txt 2>&1
      - name: Publish the bounded count-only receipt
        if: always()
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            if (!existsSync("role-qualification.txt")) process.exit(0);
            const safe = /^(catalog preflight|Catalog preflight|Catalog availability|Needs CLOUDFLARE|Account identity|Model is outside|fresh fixture|guarded |photo |Raw provider scores|TEXT_NORMALIZE,|CANDIDATE_ARBITRATE,|Deterministic baseline|Granite|Qwen|GLM|paired normalization|measurement receipt|provider metrics|accounted Neurons)/i;
            const report = readFileSync("role-qualification.txt", "utf8").split("\n").filter(line => safe.test(line)).join("\n");
            // GitHub truncates one annotation near4096 characters; retain complete counts with at most8 bounded chunks.
            if (report.length > 24000) throw new Error("Count-only receipt exceeds the annotation bound; artifact retained.");
            const parts = Math.ceil(report.length / 3000);
            for (let index = 0; index < parts; index += 1) {
              const chunk = report.slice(index * 3000, (index + 1) * 3000);
              console.log(`::notice title=V1.16 qualification ${index + 1}/${parts}::${chunk.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")}`);
            }
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v116-role-qualification
          path: role-qualification.txt
          if-no-files-found: warn
          retention-days: 90
