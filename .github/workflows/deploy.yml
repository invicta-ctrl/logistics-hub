# Production deploys from GitHub, only of a commit on main whose CI and exact-source CodeQL passed (R9; accepted amendment
# docs/specs/accepted/2026-10-03-review-hardening-amendment.md, H8). Runbook: docs/DEPLOYMENT.md, "Deploys from CI".
#
# The automatic path is OFF until Earl switches it on with the repository variable DEPLOY_FROM_CI:
#   unset     nothing runs after CI (today: Workers Builds still deploys main by itself).
#   dry-run   the whole path runs after a green CI on main, including the read-only migration gate, but
#             `wrangler deploy --dry-run` uploads nothing. Safe to set while Workers Builds still deploys.
#   true      it deploys. Set it only after Workers Builds stops deploying main, or both would deploy.
# The manual rollback and the manual (emergency) deploy are the owner's to run either way.
# Migrations never ride a deploy: the gate refuses while production lacks one, and only production-ops.yml applies them.
# Secrets live in the `production` environment, never in the repository: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit and
# D1: Read on the account) and CLOUDFLARE_ACCOUNT_ID.
# This repository's run logs and summaries are public (V116-QH03). Wrangler prints Worker version ids, the account's
# workers.dev address and deployment authors, so its output stays on the runner and each step shows a curated status. A
# rollback target is masked before any step can show it; a deploy target that is not a commit is refused before then.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy a commit on main, or roll back to an earlier Worker version
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      target:
        description: "deploy: the full 40-character commit on main. rollback: the Worker version id (wrangler deployments list)"
        required: true
        type: string
      reason:
        description: Why, recorded in the run and on the Worker version
        required: true
        type: string
      override_ci:
        description: "deploy only, emergencies: allow a commit whose CI has not passed (CodeQL and migration gates still apply)"
        required: false
        type: boolean
        default: false
      confirm:
        description: "Type exactly  DEPLOY <target>  or  ROLLBACK <target>"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && (vars.DEPLOY_FROM_CI == 'true' || vars.DEPLOY_FROM_CI == 'dry-run')
        && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      # `deploy` is the default action, so a rollback's version id can land here by mistake, as the target or in its
      # confirmation. Read from the event file, both are refused before the next step would show them in its environment.
      - name: Refuse a target that is not a commit before any step shows it
        if: github.event_name == 'workflow_dispatch'
        run: |
          target=$(jq -r '.inputs.target // ""' "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target must be a full 40-character commit."; exit 1; }
          [ "$(jq -r '.inputs.confirm // ""' "$GITHUB_EVENT_PATH")" = "DEPLOY $target" ] || { echo "::error::confirm must be exactly DEPLOY, a space, then the target."; exit 1; }
      - name: Decide which commit
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET: ${{ inputs.target }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$REF" = refs/heads/main ] || { echo "::error::Run this workflow from main."; exit 1; }
            [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target must be a full 40-character commit."; exit 1; }
            [ -n "${REASON// /}" ] || { echo "::error::Give a reason."; exit 1; }
            echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          else
            [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The CI run named no commit."; exit 1; }
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out main's deploy tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the commit to deploy
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
          path: release
          persist-credentials: false
      - name: Only a commit on main, and never an older one over a newer
        id: order
        working-directory: ops
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA is not on main."; exit 1; }
          if [ "$EVENT" = workflow_run ] && [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main has moved on to $(git rev-parse HEAD); that commit's own CI run deploys it. Nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: A manual deploy needs that commit's CI to have passed, unless overridden
        if: github.event_name == 'workflow_dispatch' && !inputs.override_ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&event=push&per_page=1" --jq '.total_count')
          [ "$passed" -gt 0 ] || { echo "::error::CI has not passed on $SHA. Fix it, or rerun with override_ci and a reason."; exit 1; }
      - uses: actions/setup-node@v4
        if: steps.order.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ops/package-lock.json
            release/package-lock.json
      - name: Install the tooling and the release
        if: steps.order.outputs.skip != 'true'
        run: |
          npm ci --prefix ops
          npm ci --prefix release
      - name: Require this source's CodeQL analysis and combined security check
        if: steps.order.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: node ops/scripts/ops/deploy-gate.mjs --github-sha "$SHA" --github-repo "$REPO"
      - name: Refuse while production lacks a migration this commit carries
        if: steps.order.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ops/scripts/ops/deploy-gate.mjs --release-dir release --wrangler node_modules/wrangler/bin/wrangler.js
      - name: Build
        if: steps.order.outputs.skip != 'true'
        working-directory: release
        env:
          RELEASE_SHA: ${{ steps.pick.outputs.sha }}
        run: GITHUB_SHA="$RELEASE_SHA" npm run build
      # LH-CD-01: the version live now is the automatic rollback target. It is private, so it is masked and kept in a runner
      # file (GitHub drops a step output that holds a masked value). Unreadable means no safe rollback, so nothing deploys.
      - name: Capture the live version to roll back to
        if: steps.order.outputs.skip != 'true' && !(github.event_name == 'workflow_run' && vars.DEPLOY_FROM_CI == 'dry-run')
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          previous=$(npx wrangler deployments status --json 2>/dev/null | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0] // ""') || previous=""
          [[ "$previous" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::Could not read the live Worker version, so there is no safe rollback target. Nothing deployed."; exit 1; }
          echo "::add-mask::$previous"
          printf '%s' "$previous" > "$RUNNER_TEMP/previous-version"
          echo "Captured the live version for an automatic rollback."
      - name: Deploy
        if: steps.order.outputs.skip != 'true'
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ steps.pick.outputs.sha }}
          HOW: ${{ github.event_name == 'workflow_dispatch' && (inputs.override_ci && 'override' || 'manual') || 'ci' }}
          DRY: ${{ github.event_name == 'workflow_run' && vars.DEPLOY_FROM_CI == 'dry-run' }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$DRY" = true ]; then
            args=(deploy --dry-run)
          else
            message="$HOW ${SHA:0:12}${REASON:+: $REASON}"
            args=(deploy --message "${message:0:100}")
          fi
          status=0
          output=$(npx wrangler "${args[@]}" 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            codes=$(grep -oE '\[code: [0-9]+\]' <<< "$output" | sort -u | paste -sd ' ' -) || true
            echo "::error::wrangler deploy failed with exit $status${codes:+ and Cloudflare $codes}. Its own output stays off this public log; see docs/DEPLOYMENT.md, CI deploy-gate."
            exit "$status"
          fi
          if [ "$DRY" = true ]; then
            echo "Dry run for $SHA: every check passed; nothing was uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # One line: a reason cannot start a line of its own that the runner would read as a command.
            reason=${REASON//[$'\r\n']/ }
            echo "Deployed $SHA ($HOW) at $(date -u +%FT%TZ). ${reason:+Reason: $reason}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # LH-CD-01: the live site must serve this build's entry bundle and answer the public catalog, or the previous version
      # comes back. Public GETs only; the rollback keeps Wrangler's output off this public log like every other step.
      - name: Smoke check the live site
        id: smoke
        if: steps.order.outputs.skip != 'true' && !(github.event_name == 'workflow_run' && vars.DEPLOY_FROM_CI == 'dry-run')
        run: node ops/scripts/ops/smoke.mjs --url https://logistics.hausc.org --dist release/dist
      - name: Roll back when the smoke check fails
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          previous=$(cat "$RUNNER_TEMP/previous-version")
          echo "::add-mask::$previous"
          status=0
          output=$(npx wrangler rollback "$previous" --message "auto: smoke check failed on ${SHA:0:12}" --yes 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            codes=$(grep -oE '\[code: [0-9]+\]' <<< "$output" | sort -u | paste -sd ' ' -) || true
            echo "::error::Automatic rollback failed with exit $status${codes:+ and Cloudflare $codes}. Roll back by hand (docs/DEPLOYMENT.md, Rollback)."
            exit "$status"
          fi
          echo "Smoke check failed on $SHA, so the previous version is live again at $(date -u +%FT%TZ)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # The target is a private Worker version id. This step reads it and its confirmation from the event file, so it never
      # shows them either; it masks the target before any later step renders it in its environment, its commands or the
      # summary, and refuses a confirmation that does not match, whose mistyped copy of the id a mask would not cover.
      - name: Mask the rollback target
        run: |
          target=$(jq -r '.inputs.target // ""' "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::target must be a Worker version id."; exit 1; }
          echo "::add-mask::$target"
          [ "$(jq -r '.inputs.confirm // ""' "$GITHUB_EVENT_PATH")" = "ROLLBACK $target" ] || { echo "::error::confirm must be exactly ROLLBACK, a space, then the target."; exit 1; }
      - name: Check the request
        env:
          REF: ${{ github.ref }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::Run this workflow from main."; exit 1; }
          [ -n "${REASON// /}" ] || { echo "::error::Give a reason."; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          status=0
          output=$(npx wrangler rollback "$TARGET" --message "${REASON:0:100}" --yes 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            codes=$(grep -oE '\[code: [0-9]+\]' <<< "$output" | sort -u | paste -sd ' ' -) || true
            echo "::error::wrangler rollback failed with exit $status${codes:+ and Cloudflare $codes}. Its own output stays off this public log; see docs/DEPLOYMENT.md, CI deploy-gate."
            exit "$status"
          fi
          reason=${REASON//[$'\r\n']/ }
          echo "Rolled back to the requested Worker version at $(date -u +%FT%TZ). Reason: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
